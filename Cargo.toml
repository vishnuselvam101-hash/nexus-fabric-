[workspace]
resolver = "2"
members = ["crates/uem", "crates/nf-dxf", "crates/nf-digest", "crates/nf-core", "crates/nf-server", "crates/nf-pdf", "crates/nf-licence", "crates/nf-form3d", "crates/nf-cadio"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[profile.release]
opt-level = 2

# Optimise the engine crates in dev builds so the test suite runs faster. Floats are unaffected:
# Rust has no fast-math, so opt-level changes do not change results.
[profile.dev.package.uem]
opt-level = 2

[profile.dev.package.nf-core]
opt-level = 2

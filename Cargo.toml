[workspace]
resolver = "2"
members = ["crates/nf-jobout", "crates/uem", "crates/nf-dxf", "crates/nf-digest", "crates/nf-core", "crates/nf-server", "crates/nf-pdf", "crates/nf-raster", "crates/nf-licence", "crates/nf-form3d", "crates/nf-cadio", "crates/nf-numread", "crates/nf-amoeba-agent", "crates/nf-amoeba-operator", "crates/nf-estimate"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false

[profile.release]
opt-level = 2

# Optimise the engine crates in dev builds so the test suite runs faster. Floats are unaffected:
# Rust has no fast-math, so opt-level changes do not change results.
[profile.dev.package.uem]
opt-level = 2

[profile.dev.package.nf-core]
opt-level = 2

[profile.dev.package.nf-pdf]
opt-level = 2

[profile.dev.package.nf-raster]
opt-level = 2

# Image decoders and deflate: slow in an unoptimised build, which makes the tests of nf-raster crawl.
[profile.dev.package.hayro-ccitt]
opt-level = 2

[profile.dev.package.hayro-jbig2]
opt-level = 2

[profile.dev.package.zune-jpeg]
opt-level = 2

[profile.dev.package.miniz_oxide]
opt-level = 2

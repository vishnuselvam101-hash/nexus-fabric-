<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NEXUS FABRIC — flagship film 2</title>
<!-- One page, one function: window.seek(seconds). Every frame is computed from time. ?lang=en|ja
     Product screens are real captured frames (light theme, capture/); they are moved and cropped, never redrawn.
     Look: off-white wallpaper with a slow cool wash; one large product window (87 % of the frame width, 18 px corners,
     a soft shadow); one statement line per scene (96–132 px, centred); small print 22 px mid-grey; one accent blue. -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--paper:#f5f5f7;--ink:#1d1d1f;--muted:#6e6e73;--acc:#2f6bff;--amber:#c77800;--sans:"Inter Variable","Noto Sans JP",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#f5f5f7;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;text-rendering:geometricPrecision;font-feature-settings:"tnum" 1}
#stage.ja{font-family:"Noto Sans JP","Inter Variable",sans-serif;font-feature-settings:"palt" 1;line-break:strict;word-break:keep-all}
#bg,#gfx{position:absolute;left:0;top:0;width:1920px;height:1080px}
#gfx{pointer-events:none}
/* the product window: one large window, 18 px corners, a soft wide shadow, on the wallpaper */
#win{position:absolute;left:125px;top:36px;width:1670px;height:940px;border-radius:18px;overflow:hidden;background:#fff;
  box-shadow:0 40px 100px rgba(24,28,38,.20),0 10px 28px rgba(24,28,38,.08)}
#rig{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#rig canvas{position:absolute;left:0;top:0;width:1920px;height:1080px}
#cur{position:absolute;left:0;top:0;width:26px;height:28px;transform-origin:0 0}
/* type: statement lines (sized by the script, 96–132 px), secondary 32 px, small print 22 px mid-grey */
.stmt{position:absolute;left:0;top:0;width:1920px;text-align:center;white-space:nowrap;font-weight:600;letter-spacing:-.022em;line-height:1.04;color:var(--ink)}
.ja .stmt{font-weight:700;letter-spacing:0}
.sec{position:absolute;left:125px;top:1000px;white-space:nowrap;font-size:32px;font-weight:400;line-height:1.2;letter-spacing:-.01em;color:var(--ink)}
.lab{font-size:22px;font-weight:400;color:var(--muted);margin-left:20px;letter-spacing:0}
.ja .sec{letter-spacing:0}
/* the equation (72 px) and its live values (30 px) */
#eq{position:absolute;left:0;top:52px;width:1920px;text-align:center;font-size:72px;font-weight:400;color:var(--ink);white-space:nowrap;line-height:1.1}
#eq i{font-style:italic;font-weight:400;padding:0 .02em}
#eq sup{font-size:.6em;vertical-align:.62em;margin-left:.04em}
#eq .fn{padding:0 .1em 0 .14em}
#eq .frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin-left:.1em}
#eq .bar{height:3px;width:100%;background:var(--ink);margin:10px 0 10px;transform-origin:0 50%}
#eq .sq{display:inline-flex;align-items:stretch}
#eq .sq svg{width:30px;height:auto;align-self:stretch;margin-right:-1px;overflow:visible}
#eq .sq svg path{fill:none;stroke:var(--ink);stroke-width:3;stroke-linejoin:miter;stroke-linecap:square}
#eq .sq .in{border-top:3px solid var(--ink);padding:4px .16em 0 .12em}
#eq .t{display:inline-block}
#eqv{position:absolute;left:0;top:252px;width:1920px;text-align:center;font-size:30px;font-weight:400;color:var(--muted);white-space:nowrap}
#eqv b{color:var(--ink);font-weight:400}
#eqv .live{color:var(--acc)}
#eqv .live b{color:var(--acc)}
/* the DXF file name over the text column (the file's own name; NOT RELEASED in amber, as the file carries it) */
#dxfname{position:absolute;left:1180px;top:290px;width:620px;font-size:26px;font-weight:400;color:var(--muted);white-space:normal;overflow-wrap:anywhere;line-height:1.3}
#dxfname b{color:var(--amber);font-weight:600}
/* end card: centred on x = 960 */
.cen{position:absolute;left:0;width:1920px;text-align:center;white-space:nowrap}
#brand{top:528px;font-size:120px;font-weight:600;letter-spacing:-.022em;line-height:1.04}
.ja #brand{font-weight:700;letter-spacing:0}
#cta{top:704px}
#cta span{display:inline-block;font-size:24px;font-weight:600;letter-spacing:0;color:#fff;background:var(--ink);border-radius:999px;padding:16px 40px 17px}
.ja #cta span{letter-spacing:.04em}
#pos{top:520px;font-size:32px;font-weight:400;color:var(--ink);letter-spacing:-.01em}
#plan{top:566px;font-size:32px;font-weight:400;color:var(--muted);letter-spacing:-.01em}
#plan i{display:inline-block;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--muted);margin-right:14px;transform:translateY(-3px)}
#today{top:640px;font-size:24px;color:var(--muted)}
#today b{font-weight:600;color:var(--ink);margin-left:24px}
#today svg{width:20px;height:20px;transform:translateY(4px);margin-left:14px}
#today .lead{margin-right:2px}
#disc{top:1000px;font-size:22px;font-weight:400;color:var(--muted);letter-spacing:0}
#credit{position:absolute;right:120px;top:1040px;font-size:22px;color:var(--muted);letter-spacing:0;white-space:nowrap}
#wm{position:absolute;left:0;top:0;font-size:132px;font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap;color:var(--ink)}
.ja #wm{font-weight:700}
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="1920" height="1080"></canvas>
  <div id="win"><div id="rig"><div id="cur"></div></div></div>
  <canvas id="gfx" width="1920" height="1080"></canvas>
  <div class="stmt" id="stmt" style="opacity:0"></div>
  <div class="sec" id="sec" style="opacity:0"></div>
  <div id="eq" style="opacity:0"></div><div id="eqv" style="opacity:0"></div>
  <div id="dxfname" style="opacity:0"></div>
  <div id="end" style="opacity:0">
    <div id="wm"></div>
    <div class="cen" id="brand" style="opacity:0"></div>
    <div class="cen" id="pos" style="opacity:0"></div>
    <div class="cen" id="plan" style="opacity:0"></div>
    <div class="cen" id="today" style="opacity:0"></div>
    <div class="cen" id="cta" style="opacity:0"></div>
    <div class="cen" id="disc" style="opacity:0"></div>
    <div id="credit" style="opacity:0"></div>
  </div>
</div>
<script src="lib/engine.js"></script>
<script src="lib/gfx.js"></script>
<script src="script/narration.js"></script>
<script src="audio/timing.js"></script>
<script src="film.js"></script>
</body>
</html>

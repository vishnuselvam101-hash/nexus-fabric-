<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS FABRIC — AMOEBA organism demo</title>
<style>
  html, body { margin: 0; height: 100%; background: #1b1d21; color: #d9dde3; overflow: hidden;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; }
  #bar { position: fixed; left: 16px; top: 14px; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #bar button, #bar select { font: inherit; color: #d9dde3; background: #23262c; border: 1px solid #3a3f48;
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #bar button:hover { border-color: #6b7280; }
  #bar button[aria-pressed="true"] { border-color: #8fa3b8; color: #d9dde3; box-shadow: 0 0 0 1px #8fa3b8 inset; }
  #bar .sep { width: 1px; height: 22px; background: #3a3f48; margin: 0 4px; }
  #hud { position: fixed; right: 16px; bottom: 12px; z-index: 2; font: 12px/1.4 ui-monospace, Menlo, Consolas, monospace; color: #8b929c; }
</style>
</head>
<body>
<div id="bar" role="toolbar" aria-label="Amoeba stages">
  <button type="button" data-stage="idle" aria-pressed="true">idle</button>
  <button type="button" data-stage="surround" aria-pressed="false">surround</button>
  <button type="button" data-stage="engulf" aria-pressed="false">engulf</button>
  <button type="button" data-stage="digest" aria-pressed="false">digest</button>
  <button type="button" data-stage="release" aria-pressed="false">release</button>
  <button type="button" data-stage="hold" aria-pressed="false">hold</button>
  <span class="sep"></span>
  <label>quality
    <select id="quality">
      <option value="auto" selected>auto</option>
      <option value="low">low</option>
      <option value="med">med</option>
      <option value="high">high</option>
    </select>
  </label>
</div>
<div id="stage"></div>
<div id="hud" aria-live="off"></div>

<script type="importmap">
{ "imports": { "three": "../../web/vendor/three/three.module.js" } }
</script>
<script type="module">
import * as THREE from '../../web/vendor/three/three.module.js';
import { createAmoeba } from '../../web/js/lib/amoeba.js';

const host = document.getElementById('stage');
const hud = document.getElementById('hud');

// the part: a steel cylinder lying on its side, right of the organism
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, 1, 0.1, 100);
camera.position.set(0, 0, 10);
camera.lookAt(0, 0, 0);
scene.add(new THREE.HemisphereLight(0xdfe6ee, 0x3a3e46, 2.0));
const key = new THREE.DirectionalLight(0xffffff, 2.6);
key.position.set(2, 3, 4);
scene.add(key);
const warm = new THREE.DirectionalLight(0xff6a1a, 0.6);
warm.position.set(-3, -1, 2);
scene.add(warm);
const steel = new THREE.MeshStandardMaterial({ color: 0xc4ccd5, metalness: 0.45, roughness: 0.32 });
const fill = new THREE.DirectionalLight(0xdfe8f2, 1.0);
fill.position.set(-2, 1, 3);
scene.add(fill);
const part = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.16, 0.8, 64), steel);
part.position.set(1.45, -0.02, 0);
part.rotation.set(0.35, 0.2, Math.PI / 2);
scene.add(part);

const amoeba = createAmoeba(host, { quality: 'auto', scene, camera });
amoeba.setTarget(part);
window.amoeba = amoeba;

const buttons = [...document.querySelectorAll('[data-stage]')];
function pick(stage) {
  amoeba.setStage(stage);
  buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.stage === stage)));
}
buttons.forEach((b) => b.addEventListener('click', () => pick(b.dataset.stage)));
const q = document.getElementById('quality');
q.addEventListener('change', () => {
  if (q.value === 'auto') { amoeba.dispose(); location.reload(); return; }
  amoeba.setQuality(q.value);
});

setInterval(() => {
  const s = amoeba.stats();
  hud.textContent = `${s.mode} · quality ${s.quality} · ${s.fps} fps · stage ${s.stage}`;
}, 500);
</script>
</body>
</html>

[package]
name = "nf-licence"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
description = "Offline Ed25519 licence format, verification and state machine (library and owner-side nf-licence tool)"

[dependencies]
# Ed25519 signing/verification, pure Rust (RustCrypto). Default features only.
ed25519-dalek = "2"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"

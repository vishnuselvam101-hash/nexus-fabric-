[package]
name = "nf-pdf"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
description = "Offline converter from vector PDF pages to DXF R12 (library and nf-pdf2dxf child process)"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nf-pdf2dxf"
path = "src/bin/nf-pdf2dxf.rs"

[dependencies]
# Pure Rust inflate (miniz_oxide backend); no C code is built.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
# Safe setrlimit wrapper, used only by the command-line program on Unix.
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
nf-dxf = { path = "../nf-dxf" }

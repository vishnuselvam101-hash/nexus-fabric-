[package]
name = "nf-machine"
version = "0.1.0"
edition = "2021"
license = "LicenseRef-Proprietary"
publish = false
description = "Machine profiles and the hand-off export gate: writes checked DXF files into a folder for the factory's own CAM. Starts, moves or controls no machine."

[lib]
path = "src/lib.rs"

[dependencies]
encoding_rs = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"

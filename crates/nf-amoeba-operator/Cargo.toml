[package]
name = "nf-amoeba-operator"
version = "0.1.0"
edition = "2024"
publish = false
description = "AMOEBA operator: eyes (page reader), brain (planner) and hands (the AMOEBA tool bridge) that do an order's work visibly, step by step"

[lib]
path = "src/lib.rs"

[[bin]]
name = "nf-operator"
path = "src/main.rs"

[dependencies]
nf-amoeba-agent = { version = "0.1.0", path = "../nf-amoeba-agent" }
nf-core = { version = "0.1.0", path = "../nf-core" }
serde_json = "1.0.154"

[dev-dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }

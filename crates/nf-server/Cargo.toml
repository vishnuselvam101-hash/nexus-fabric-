[package]
name = "nf-server"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
axum = "0.8.9"
getrandom = "0.4.3"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1.20", features = ["tokio", "service", "server-graceful"] }
nf-cad = { version = "0.1.0", path = "../nf-cad" }
nf-core = { version = "0.1.0", path = "../nf-core" }
nf-digest = { version = "0.1.0", path = "../nf-digest" }
nf-licence = { version = "0.1.0", path = "../nf-licence" }
nf-numread = { version = "0.1.0", path = "../nf-numread" }
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
uem = { version = "0.1.0", path = "../uem" }

[features]
# The initial page reader is still opt-in; PZ-2's second-pass check uses nf_numread::MODEL_ID
# unconditionally, so the dependency itself is no longer optional. Enabling this flag is kept
# for existing deployments but no longer changes Cargo dependencies.
number-reader = []

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
futures-core = "0.3"
# Test fixtures of the PDF conversion tests (compressed content streams); not in the server.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

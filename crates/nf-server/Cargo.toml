[package]
name = "nf-server"
version = "0.1.0"
edition = "2024"

[dependencies]
aes-gcm = "0.11.1"
argon2 = "0.6.0"
axum = "0.8.9"
hex = "0.4.3"
nf-core = { version = "0.1.0", path = "../nf-core" }
rand = "0.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
uem = { version = "0.1.0", path = "../uem" }

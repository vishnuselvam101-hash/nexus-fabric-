<!-- Shell -->
<header class="topbar" role="banner">
  <div class="topbar-left">
    <button id="hamburger" class="btn-icon mobile-only" type="button" aria-label="Menu" aria-expanded="false" aria-controls="nav-links">
      <svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg>
    </button>
    <a href="#/" class="logo" aria-label="NEXUS FABRIC home">NEXUS FABRIC</a>
  </div>
  <nav id="nav-links" class="topbar-nav" role="navigation" aria-label="Main">
    <a href="#/history" data-i18n="nav.history">History</a>
    <a href="#/help" data-i18n="nav.help">Help</a>
    <a href="#/amoeba" data-i18n="ws.amoeba">AMOEBA</a>
    <div class="dropdown">
      <button class="btn-text" type="button" aria-haspopup="true" aria-expanded="false" data-i18n="nav.more">More</button>
      <div class="dropdown-menu" role="menu">
        <a href="#/workspace/calculations" role="menuitem" data-i18n="ws.calculations">Calculations</a>
        <a href="#/workspace/projects" role="menuitem" data-i18n="ws.projects">Projects</a>
        <a href="#/verification" role="menuitem" data-i18n="nav.verification">Verification</a>
        <a href="#/manufacturing" role="menuitem" data-i18n="nav.manufacturing">Manufacturing</a>
        <a href="#/workspace/obligations" role="menuitem" data-i18n="ws.obligations">Obligations</a>
        <a href="#/workspace/audit" role="menuitem" data-i18n="ws.audit">Audit</a>
        <a href="#/workspace/users" role="menuitem" data-i18n="ws.users">Users</a>
      </div>
    </div>
  </nav>
  <div class="topbar-right">
    <button id="btn-theme" class="btn-icon" type="button" aria-label="Toggle theme">
      <svg class="icon icon-sun" aria-hidden="true"><use href="#i-sun"/></svg>
      <svg class="icon icon-moon" aria-hidden="true"><use href="#i-moon"/></svg>
    </button>
    <button id="btn-lang" class="btn-icon" type="button" aria-label="Toggle language">EN</button>
    <button id="btn-user" class="btn-icon avatar" type="button" aria-label="User menu" aria-haspopup="true" aria-expanded="false"></button>
  </div>
</header>

<main id="view" role="main" aria-live="polite">
  <div class="loading" role="status" aria-label="Loading">NEXUS FABRIC</div>
</main>

<!-- Login -->
<template id="t-login">
  <section class="card card-login" aria-labelledby="login-heading">
    <h1 id="login-heading" data-i18n="login.title">Sign in</h1>
    <form id="login-form" autocomplete="on">
      <label for="login-user" data-i18n="login.user">Username</label>
      <input id="login-user" name="username" type="text" required autocomplete="username">
      <label for="login-pass" data-i18n="login.pass">Password</label>
      <input id="login-pass" name="password" type="password" required autocomplete="current-password">
      <button type="submit" class="btn-primary" data-i18n="login.submit">Sign in</button>
    </form>
  </section>
</template>

<!-- Convert (hero drop zone) -->
<template id="t-convert">
  <section class="convert" aria-labelledby="convert-heading">
    <div id="drop-zone" class="drop-zone" role="button" tabindex="0" aria-labelledby="convert-heading">
      <svg class="icon icon-lg" aria-hidden="true"><use href="#i-upload"/></svg>
      <h1 id="convert-heading" data-i18n="convert.title">Drop a PDF or click to browse</h1>
      <input id="file-input" type="file" accept=".pdf,application/pdf" hidden>
    </div>
    <details class="options">
      <summary data-i18n="convert.options">Options</summary>
      <label for="page-num" data-i18n="convert.page">Page number</label>
      <input id="page-num" type="number" min="1" value="1">
    </details>
    <section class="recent-strip" aria-label="Recent conversions">
      <h2 class="sr-only" data-i18n="convert.recent">Recent conversions</h2>
      <div id="recent-list" role="list"></div>
    </section>
  </section>
</template>

<!-- Processing -->
<template id="t-processing">
  <section class="processing" aria-labelledby="proc-heading">
    <h2 id="proc-heading" class="proc-filename" data-i18n="proc.title">Processing</h2>
    <div class="progress-bar" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-fill"></div>
    </div>
    <ol class="stage-list" aria-label="Stages">
      <li data-stage="upload"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg> <span data-i18n="proc.upload">Upload</span></li>
      <li data-stage="extract"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg> <span data-i18n="proc.extract">Extract</span></li>
      <li data-stage="pattern"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg> <span data-i18n="proc.pattern">Pattern</span></li>
      <li data-stage="verify"><svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg> <span data-i18n="proc.verify">Verify</span></li>
    </ol>
    <button type="button" class="btn-secondary" id="btn-cancel" data-i18n="proc.cancel">Cancel</button>
  </section>
</template>

<!-- Result -->
<template id="t-result">
  <section class="result" aria-labelledby="result-heading">
    <div class="badge" role="status">
      <svg class="icon icon-xl badge-icon" aria-hidden="true"><use href="#i-file"/></svg>
      <!-- filled by the result view from the server's state; never a default verdict -->
      <h1 id="result-heading" class="badge-label"></h1>
    </div>
    <div id="checks-grid" class="checks-grid" role="list" aria-label="Verification checks"></div>
    <div class="result-actions">
      <button type="button" class="btn-primary" id="btn-dxf">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
        <span data-i18n="cv2.dxf">Download DXF</span>
      </button>
      <button type="button" class="btn-secondary" id="btn-report">
        <svg class="icon" aria-hidden="true"><use href="#i-download"/></svg>
        <span data-i18n="cv2.report">Download Report</span>
      </button>
    </div>
    <button type="button" class="btn-text" id="btn-another" data-i18n="cv2.another">Convert another</button>
  </section>
</template>

<!-- Workspace -->
<template id="t-workspace">
  <div class="workspace">
    <aside class="ws-sidebar" role="tablist" aria-label="Workspace sections">
      <button role="tab" data-tab="calculations" aria-selected="true" data-i18n="ws.calculations">Calculations</button>
      <button role="tab" data-tab="projects" data-i18n="ws.projects">Projects</button>
      <button role="tab" data-tab="amoeba" data-i18n="ws.amoeba">AMOEBA</button>
      <button role="tab" data-tab="obligations" data-i18n="ws.obligations">Obligations</button>
      <button role="tab" data-tab="audit" data-i18n="ws.audit">Audit</button>
      <button role="tab" data-tab="users" data-i18n="ws.users">Users</button>
    </aside>
    <div class="ws-content" role="tabpanel" aria-label="Workspace content"></div>
  </div>
</template>

<noscript>
  <p lang="en">NEXUS FABRIC requires JavaScript to run. This is a development build — outputs are not validated and must not be used for manufacturing.</p>
  <p lang="ja">NEXUS FABRICの利用にはJavaScriptが必要です。開発版のため出力は未検証です。製造に使用しないでください。</p>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>

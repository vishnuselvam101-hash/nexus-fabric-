<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Machine export</title>
<style>
:root { color-scheme: light dark; --bg: #f6f6f4; --fg: #1d1d1b; --mut: #6b6b66; --card: #fff; --line: #d8d8d2; --ok: #1f7a3d; --bad: #a3282b; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #161615; --fg: #ecece8; --mut: #9a9a93; --card: #1f1f1d; --line: #3a3a36; --ok: #5cc27e; --bad: #ff8a8c; } }
:root[data-theme="dark"] { --bg: #161615; --fg: #ecece8; --mut: #9a9a93; --card: #1f1f1d; --line: #3a3a36; --ok: #5cc27e; --bad: #ff8a8c; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Noto Sans JP", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 16px; }
header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
h1 { font-size: 20px; margin: 8px 0; }
section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin: 12px 0; }
label { display: block; margin: 8px 0 4px; color: var(--mut); font-size: 14px; }
select, button { font: inherit; width: 100%; box-sizing: border-box; padding: 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
button { background: var(--fg); color: var(--bg); margin-top: 12px; cursor: pointer; }
button:disabled { opacity: .5; cursor: default; }
#lang { width: auto; margin: 0; padding: 6px 10px; }
.msg { margin-top: 10px; font-weight: 600; }
.ok { color: var(--ok); } .bad { color: var(--bad); }
ul { padding-left: 18px; margin: 6px 0; }
small { color: var(--mut); }
</style>
</head>
<body>
<main>
<header><h1 id="title">Machine export</h1><button id="lang" type="button">日本語</button></header>
<p><small id="note"></small></p>
<section>
  <label for="calc" id="l-calc">Job</label>
  <select id="calc"></select>
  <label for="prof" id="l-prof">Machine profile</label>
  <select id="prof"></select>
  <label for="folder" id="l-folder">Folder</label>
  <select id="folder"></select>
  <button id="go" type="button" disabled></button>
  <div id="result" class="msg" role="status" aria-live="polite"></div>
</section>
</main>
<script type="module" src="/machine/app.mjs"></script>
</body>
</html>
